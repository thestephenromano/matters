# cargo-mutants configuration (ci/mutants.sh).
#
# Each exclusion is a mutant that cannot change behaviour, with the reason.
# Names are matched without line numbers, so they survive edits elsewhere.

# The least time a mutant's tests get before it counts as hung. The time is
# otherwise set from the unmutated run, which runs alone. CI tests four
# mutants at once, so builds overlap test runs, and tests that write SQLite
# files to disk slowed past that limit: mutants that every test catches
# within seconds when run alone (all of undo.rs on #180) were reported as
# timeouts. Since then the unmutated core suite itself takes 90 to 113 s in
# CI (#245's run, with sync's tests), so at 120 s mutants every test caught
# were reported as hung. A real hang still fails, after four minutes.
minimum_test_timeout = 240

# The fuzz harness (#45) drives receiving and the engine's imports for
# cargo-fuzz; it is built only with the `fuzzing` feature and is not part of
# Matters. Its oracle is the absence of a panic under fuzzing (ci/fuzz.sh)
# and its corpus replay: a harness that does less finds less, which no test
# of Matters' behaviour can observe.
exclude_globs = ["crates/matters-core/src/fuzzing.rs"]

exclude_re = [
    # Schedule::parse_typed answers "" and "today" itself, as Matters' own
    # words, rather than leaving them to `interim`. Without these arms
    # `interim` gives the same answers (no date for "", today for "today"),
    # which tests/typed_when_tests.rs pins.
    'delete match arm "" in Schedule::parse_typed$',
    'delete match arm "today" in Schedule::parse_typed$',
    # Zeroing a device's key seeds as they are freed (#37) is defence in
    # depth against later memory disclosure; no safe test can read freed
    # memory, so skipping it changes nothing a test can observe.
    'replace <impl Drop for DeviceSeeds>::drop with \(\)$',
    # keep_part answers Part until a checkpoint's last part arrives, without
    # reading the parts kept. Assembling early answers the same, since
    # assemble finds them incomplete; the check spares reading every kept
    # part on each arrival, work quadratic in a checkpoint's 512 parts.
    'replace == with != in keep_part$',
    'replace < with > in keep_part$',
    # The engine checker's child decodes every block of a snapshot's
    # history (#45), in case Loro left some encoded. Loro 1.18 already
    # decodes them when it imports a snapshot into an empty document
    # (measured: 32 MB of deleted text took the same 32 MiB with or without
    # it), so skipping it changes nothing a test can observe today; it
    # keeps the child's bound if a later Loro defers the work.
    'replace Document::read_history with \(\)$',
]
