[package]
name = "matters-syncd"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false
authors = ["Matters Contributors"]
description = "Headless Matters sync: the per-user database, the system keyring, a relay (#39)"

[dependencies]
matters-core = { path = "../matters-core" }
matters-keyring = { path = "../matters-keyring" }
matters-sync-client = { path = "../matters-sync-client" }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "sync"] }
