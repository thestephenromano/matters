[package]
name = "matters-core"
version = "0.1.0"
edition = "2021"
authors = ["Matters Contributors"]
description = "Core GTD engine and SQLite persistence for Matters"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
dirs = "6.0"

[dev-dependencies]
tempfile = "3.13"
