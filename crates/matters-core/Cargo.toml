[package]
name = "matters-core"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false
authors = ["Matters Contributors"]
description = "Core GTD engine and SQLite persistence for Matters"

[dependencies]
rusqlite = { version = "=0.43.0", features = ["bundled", "uuid"] }
# Dates and times; chrono is unmaintained (RUSTSEC-2026-0543, #123).
jiff = { version = "0.2", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "v8", "serde"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
dirs = "6.0"
# The per-device settings file (#72).
toml = "1.2"
# Typed dates in the When picker ("tomorrow", "fri", "in 3 days"); decided on #59.
interim = { version = "0.2.2", features = ["jiff_0_2"] }
# The sync engine's document (ADR 0001, adopted 2026-11-20, #35).
loro = "=1.18.0"
serde_json = "1"
# Sealing recorded writes into authenticated records (#36).
matters-sync = { path = "../matters-sync" }
# Wipes recovery words held while recovering (#45).
zeroize = "1"

[features]
# Raw read-write SQL for tests that stage states the typed operations
# never produce (`Database::with_raw_conn`). Never enabled by an app.
test-support = []

[dev-dependencies]
tempfile = "3.13"
# The integration tests use `test-support`.
matters-core = { path = ".", features = ["test-support"] }
