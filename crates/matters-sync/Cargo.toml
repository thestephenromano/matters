[package]
name = "matters-sync"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false
authors = ["Matters Contributors"]
description = "Post-quantum authenticated sync records for Matters (ADR 0002, #36)"

[dependencies]
# Exact pins approved for production on 2026-11-20 (ADR 0002, #36).
minicbor = { version = "=2.3.1", default-features = false, features = ["std"] }
hpke-rs = { version = "=0.8.0", default-features = false, features = ["std", "libcrux", "draft-ietf-hpke-pq"] }
hpke-rs-crypto = "=0.8.0"
hpke-rs-libcrux = { version = "=0.8.0", default-features = false, features = ["std", "sys-rng", "draft-ietf-hpke-pq"] }
libcrux-ml-dsa = { version = "=0.0.11", default-features = false, features = ["std", "mldsa65"] }
# SHA-384 record and chain hashes, from the same provider family.
libcrux-sha2 = "=0.0.9"
# Invitation keys and bindings (#37): HKDF-SHA384 and HMAC-SHA384 from the
# same provider family, already compiled in through hpke-rs-libcrux.
libcrux-hkdf = "=0.0.9"
libcrux-hmac = "=0.0.9"
# Constant-time tag comparison; already compiled in through hpke-rs.
subtle = "=2.6.1"
# Recovery words (#37, decided 2026-11-21): BIP39 entropy to English words
# and back, checksum included, without BIP39's PBKDF2 seed. CC0-1.0. Its
# zeroize feature wipes parsed mnemonics; zeroize is already compiled in.
bip39 = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
thiserror = "2.0"

[features]
# The fuzz targets' bodies (fuzz/, #36), for cargo-fuzz and the replay test.
fuzzing = []

[dev-dependencies]
# The corpus replay test runs the fuzz targets' bodies.
matters-sync = { path = ".", features = ["fuzzing"] }
serde_json = "1"
