[package]
name = "matters-relay"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false
authors = ["Matters Contributors"]
description = "The durable encrypted sync relay (#38, docs/SYNC_SERVICE_CONTRACT.md)"

[features]
# Crash points for the conformance runner (src/fault.rs). Tests only.
fault-injection = []

[dependencies]
matters-sync = { path = "../matters-sync" }
# ADR 0003 (approved 2026-11-20): PostgreSQL through sqlx 0.9, Tokio runtime.
# TLS to the database (#45) on rustls with ring, the provider the sync
# client uses (#39), trusting the operating system's roots
# (rustls-native-certs, already in the graph), so that sslmode=require and
# verify-full work; without a TLS feature they silently could not.
sqlx = { version = "=0.9.1", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "macros", "tls-rustls-ring-native-roots"] }
tokio = { version = "1.54", features = ["sync", "rt-multi-thread", "net", "macros", "signal", "time"] }
# ADR 0003: axum on hyper 1 over HTTP/1.1 and HTTP/2 (TLS terminates at a
# proxy in front, #44); `ws` for commit hints.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "tokio", "ws", "matched-path"] }
# The server under axum's router, with the header timeout axum::serve does
# not set (src/server.rs). Already in the graph through axum.
hyper-util = { version = "0.1.21", default-features = false, features = ["server-auto", "tokio", "service", "http1", "http2"] }
base64 = "0.22"
minicbor = { version = "=2.3.1", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }
# Session challenges and tokens: 256 bits from the OS. Already in the graph
# through uuid. MIT OR Apache-2.0.
getrandom = "0.4.3"
thiserror = "2.0"
# Redacted operational metrics (#44, decided 2026-11-21): the Prometheus
# project's own client, OpenMetrics text exposition, Apache-2.0.
prometheus-client = "=0.26.0"

[dev-dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
# The hints client in the tests; already in the graph through axum's ws.
tokio-tungstenite = "0.29"
futures-util = "0.3"
serde_json = "1"
tempfile = "3.13"
# The conformance runner needs the crash points.
matters-relay = { path = ".", features = ["fault-injection"] }
uuid = { version = "1", features = ["v4"] }
