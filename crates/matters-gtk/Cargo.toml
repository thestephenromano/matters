[package]
name = "matters-gtk"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false
authors = ["Matters Contributors"]
description = "GTK4 / Libadwaita frontend for Matters"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
matters-core = { path = "../matters-core" }
# Sync (#42): the app's sync session, and this device's keys in the keyring.
matters-sync-app = { path = "../matters-sync-app" }
matters-keyring = { path = "../matters-keyring" }
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
# The sync test's session keeps its keys in memory (#42).
matters-core = { path = "../matters-core", features = ["test-support"] }
tempfile = "3.13"
