[package]
name = "matters-gtk"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false
authors = ["Matters Contributors"]
description = "GTK4 / Libadwaita frontend for Matters"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
matters-core = { path = "../matters-core" }
uuid = { version = "1.10", features = ["v4"] }
