[package]
name = "matters-ui"
version = "0.1.0"
edition = "2021"
authors = ["Matters Contributors"]
description = "Native Qt 6 / QML GUI for Matters"

[lib]
name = "matters_ui"
path = "src/lib.rs"

[[bin]]
name = "matters-ui"
path = "src/main.rs"

[features]
# QML interaction tests (Qt Quick Test). Run with:
#   cargo test -p matters-ui --features ui-tests
ui-tests = []

[[test]]
name = "ui"
path = "tests/ui.rs"
harness = false
required-features = ["ui-tests"]

[[test]]
name = "style"
path = "tests/style.rs"
harness = false
required-features = ["ui-tests"]

[dependencies]
cxx = "1.0"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
matters-core = { path = "../matters-core" }
uuid = { version = "1.10", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cxx-qt-build = { version = "0.10.0" }

[dev-dependencies]
tempfile = "3.13"
