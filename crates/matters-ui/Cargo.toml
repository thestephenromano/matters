[package]
name = "matters-ui"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false
authors = ["Matters Contributors"]
description = "Native Qt 6 / QML GUI for Matters"

[lib]
name = "matters_ui"
path = "src/lib.rs"

[[bin]]
name = "matters-ui"
path = "src/main.rs"

[features]
# QML interaction tests (Qt Quick Test). Run with:
#   cargo test -p matters-ui --features ui-tests
ui-tests = []

[[test]]
name = "ui"
path = "tests/ui.rs"
harness = false
required-features = ["ui-tests"]

[[test]]
name = "style"
path = "tests/style.rs"
harness = false
required-features = ["ui-tests"]

[dependencies]
cxx = "1.0"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
matters-core = { path = "../matters-core" }
# Calendar events' local days and times (#62), reminder times and the
# system time zone (#60); the core's date library.
jiff = "0.2"
# Reminder notifications through the freedesktop service, over zbus
# (decided on #60).
notify-rust = "4.19"
# The desktop's accent colour and contrast preference, from the XDG desktop
# portal (decided on #76): the zbus notify-rust already brings, and its
# Stream trait for the portal's change signal.
zbus = "6.4"
futures-core = "0.3"
uuid = { version = "1.10", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cxx-qt-build = { version = "0.10.0" }

[dev-dependencies]
tempfile = "3.13"
