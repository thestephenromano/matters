# cargo-deny policy for the Matters workspace (ci/deny.sh runs it).
# The sync prototype under experiments/ is a separate workspace with its own
# gates.

[graph]
all-features = true

[advisories]
# Every RustSec advisory that affects a dependency fails the check. An
# exception goes in `ignore` with the advisory id, a reason, and when it can
# be removed.
ignore = [
    # atomic-polyfill is unmaintained (no known vulnerability). It reaches
    # us only through Loro 1.18's postcard -> heapless 0.7. Remove when Loro
    # leaves heapless 0.7 (#174). Approved 2026-11-20.
    { id = "RUSTSEC-2023-0089", reason = "unmaintained, via Loro's postcard; tracked in #174" },
    # proc-macro-error2 is unmaintained (no known vulnerability). It is a
    # compile-time macro reached only through libcrux's hax-lib 0.3
    # (libcrux-intrinsics -> core-models -> hax-lib-macros). Remove when
    # libcrux leaves hax-lib 0.3 (#192). Approved 2026-11-20.
    { id = "RUSTSEC-2026-0173", reason = "unmaintained compile-time macro via libcrux's hax-lib; tracked in #192" },
]

[licenses]
# Matters is MIT OR Apache-2.0; dependencies may use these licenses.
allow = [
    # BlueOak Model License: minicbor, the sync record codec (approved
    # 2026-11-20 with the record stack's production adoption, #36).
    "BlueOak-1.0.0",
    # Boost: Loro's xxhash-rust (approved 2026-11-20 with Loro's adoption).
    "BSL-1.0",
    # Creative Commons public-domain dedication: bip39 and its
    # bitcoin_hashes and hex-conservative, the recovery words (approved
    # 2026-11-21 with the recovery-secret decision, #37).
    "CC0-1.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# Build tools of crabgrind, which libcrux-secrets uses only under
# cfg(valgrind_ct_test), a constant-time test configuration Matters never
# builds, so neither ships. Approved 2026-11-20 (#36); any other crate with
# these licenses is still refused.
exceptions = [
    { crate = "bindgen", allow = ["BSD-3-Clause"] },
    { crate = "libloading", allow = ["ISC"] },
    # subtle: constant-time comparisons in hpke-rs, the approved record
    # stack (#37). Ships in the binary; its notice goes with distributions
    # (#44 collects third-party notices). Approved 2026-11-21.
    { crate = "subtle", allow = ["BSD-3-Clause"] },
    # matchit: axum's path router, in the relay (ADR 0003). Approved
    # 2026-11-21 (#38); BSD-3-Clause stays refused for other crates.
    { crate = "matchit", allow = ["BSD-3-Clause"] },
    # ring: rustls' crypto provider for the sync client's TLS (#39),
    # decided 2026-11-21. ISC stays refused for other crates.
    { crate = "ring", allow = ["ISC"] },
    # rustls' certificate verifier and ring's input parser, part of the same
    # TLS stack (#39, 2026-11-21).
    { crate = "rustls-webpki", allow = ["ISC"] },
    { crate = "untrusted", allow = ["ISC"] },
    # rustls-platform-verifier's root store on platforms without a system
    # one; not built on Linux (#39, 2026-11-21).
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
# Duplicate versions are reported, not refused: they come and go with
# upstream releases and are a size cost, not a correctness one.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between the workspace's own, unpublished crates.
allow-wildcard-paths = true

[sources]
# Dependencies come from crates.io only.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
