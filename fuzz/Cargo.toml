[package]
name = "matters-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
description = "cargo-fuzz targets for the sync parsers (#36) and the client's parsers of relay responses (#45); run by ci/fuzz.sh"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
matters-sync = { path = "../crates/matters-sync", features = ["fuzzing"] }
matters-sync-client = { path = "../crates/matters-sync-client", features = ["fuzzing"] }

# Its own workspace: built only on the pinned nightly, by ci/fuzz.sh.
[workspace]
members = ["."]

[[bin]]
name = "record"
path = "fuzz_targets/record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control"
path = "fuzz_targets/control.rs"
test = false
doc = false
bench = false

[[bin]]
name = "invitation"
path = "fuzz_targets/invitation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "typed"
path = "fuzz_targets/typed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "checkpoint"
path = "fuzz_targets/checkpoint.rs"
test = false
doc = false
bench = false

[[bin]]
name = "relay_page"
path = "fuzz_targets/relay_page.rs"
test = false
doc = false
bench = false

[[bin]]
name = "relay_snapshots"
path = "fuzz_targets/relay_snapshots.rs"
test = false
doc = false
bench = false
