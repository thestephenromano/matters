name: Set up the build
description: >-
  System packages (ci/fedora-deps.sh), the Rust toolchain pinned in
  rust-toolchain.toml, optionally the cargo-deny pinned in
  ci/cargo-deny-version, and the cargo cache.
inputs:
  deps-args:
    description: Extra arguments for ci/fedora-deps.sh
    default: ""
  cargo-deny:
    description: Also install the pinned cargo-deny ("true" or "false")
    default: "false"
runs:
  using: composite
  steps:
    # The checkout belongs to another user than the container's root, and
    # actions/checkout trusts it only during its own step.
    - name: Trust the checkout for git
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Install system packages
      shell: bash
      run: bash ci/fedora-deps.sh ${{ inputs.deps-args }}
    - name: Read pinned versions
      id: pins
      shell: bash
      run: |
        echo "toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
        echo "cargo-deny=$(tr -d '[:space:]' < ci/cargo-deny-version)" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: ${{ steps.pins.outputs.toolchain }}
        components: clippy, rustfmt
    - if: inputs.cargo-deny == 'true'
      # Installs the pinned release and checks it against the action's
      # SHA-256 manifest.
      uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
      with:
        tool: cargo-deny@${{ steps.pins.outputs.cargo-deny }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
