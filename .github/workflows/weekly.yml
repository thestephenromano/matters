name: Weekly

# Checks whose result can change without a change to the code: new security
# advisories against main's dependencies, and UI tests that pass only
# sometimes (each lane runs three times). Also the sync suite at a length
# too long for every change (#43, docs/SYNC_VERIFICATION.md).
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  advisories:
    name: dependency policy on main
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 20
    steps:
      - run: dnf -y install --setopt=install_weak_deps=False git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          tools: cargo-deny
      - run: ci/deny.sh

  ui-repeat:
    name: Qt UI tests (${{ matrix.lane }}, run ${{ matrix.run }})
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [reduced, animations]
        run: [1, 2, 3]
    steps:
      - run: dnf -y install --setopt=install_weak_deps=False git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: ci/ui-lane.sh ${{ matrix.lane }} target/ui-reports
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-ui-${{ matrix.lane }}-${{ matrix.run }}
          path: target/ui-reports/
          retention-days: 30
          if-no-files-found: warn

  # The broader sync suite (#43): what the per-change gates run in small,
  # run here at length. Each keeps its evidence as an artifact.
  convergence:
    name: sync convergence, 48 recorded schedules
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 120
    services:
      postgres:
        image: docker.io/library/postgres:18.7
        env:
          POSTGRES_PASSWORD: relay
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      MATTERS_RELAY_TEST_DATABASE_URL: postgres://postgres:relay@postgres:5432/postgres
      MATTERS_RELAY_REQUIRE_DB: "1"
      MATTERS_CONVERGENCE_SEEDS: "48"
    steps:
      - run: dnf -y install --setopt=install_weak_deps=False git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: cargo test --locked --release -p matters-sync-client --test convergence_tests -- --nocapture

  fuzz-campaign:
    name: sync parsers fuzzed, ten minutes each
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 90
    steps:
      - run: dnf -y install --setopt=install_weak_deps=False git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          tools: cargo-fuzz
      - run: ci/fuzz.sh --all 600
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 30
          if-no-files-found: ignore

  checkpoint-cost:
    name: checkpoint cost, measured
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 60
    steps:
      - run: dnf -y install --setopt=install_weak_deps=False git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The runner is not the evidence host (docs/evidence names its own):
      # this tracks the trend, it sets no budget.
      - run: |
          mkdir -p target/checkpoint-cost
          cargo run --locked --release -p matters-core --features test-support \
            --example checkpoint_cost -- target/checkpoint-cost 250 1000 \
            | tee target/checkpoint-cost/report.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-checkpoint-cost
          path: target/checkpoint-cost/report.jsonl
          retention-days: 90
