name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Each job runs a gate script from ci/; ci/check.sh runs them all locally.
# Qt 6.8+ and current GTK/libadwaita come from Fedora's packages, the same
# system the app is developed on. git is installed before checkout so the
# checkout keeps .git (the hygiene gate reads the index).
jobs:
  lint:
    name: lint (fmt, clippy, docs, deny, hygiene)
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 30
    steps:
      - run: dnf -y install --setopt=install_weak_deps=False git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          tools: cargo-deny
      - run: ci/hygiene.sh
      - run: ci/lint.sh
      - run: ci/deny.sh

  tests:
    name: workspace tests
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 30
    steps:
      - run: dnf -y install --setopt=install_weak_deps=False git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: ci/workspace-tests.sh

  ui:
    name: Qt UI tests (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [reduced, animations]
    steps:
      - run: dnf -y install --setopt=install_weak_deps=False git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: ci/ui-lane.sh ${{ matrix.lane }} target/ui-reports
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-${{ matrix.lane }}
          path: target/ui-reports/
          retention-days: 14
          if-no-files-found: warn

  style:
    name: control style under COSMIC's theme
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 30
    env:
      MATTERS_REQUIRE_COSMIC_THEME: "1"
    steps:
      - run: dnf -y install --setopt=install_weak_deps=False git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          deps-args: --desktop-themes
      - run: ci/style-check.sh

  coverage:
    name: core coverage (floor in ci/coverage.sh)
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 30
    steps:
      - run: dnf -y install --setopt=install_weak_deps=False git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          tools: cargo-llvm-cov
          components: llvm-tools
      - run: ci/coverage.sh target/coverage
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: target/coverage/
          retention-days: 14
          if-no-files-found: warn

  mutants:
    name: core mutants in the diff
    runs-on: ubuntu-24.04
    container: fedora:44
    # ci/mutants.sh's 120-minute budget, with time to set up and report.
    timeout-minutes: 135
    steps:
      - run: dnf -y install --setopt=install_weak_deps=False git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff is taken against main's history.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          tools: cargo-mutants
      - run: ci/mutants.sh target/mutants
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants
          path: target/mutants/
          retention-days: 14
          if-no-files-found: ignore

  flatpak:
    name: Flatpak (build, install, start, update)
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
      # flatpak-builder and flatpak run sandbox with bubblewrap, which needs
      # namespaces a default container doesn't allow.
      options: --privileged
    timeout-minutes: 60
    steps:
      # No Rust setup: the manifest brings the pinned toolchain.
      - run: >-
          dnf -y install --setopt=install_weak_deps=False git curl tar xz
          flatpak flatpak-builder desktop-file-utils appstream sqlite dbus-daemon
          python3-aiohttp python3-tomlkit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ci/flatpak.sh target/flatpak
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-logs
          path: target/flatpak/*.log
          retention-days: 14
          if-no-files-found: ignore

  fuzz:
    name: sync parsers fuzzed
    runs-on: ubuntu-24.04
    container: fedora:44
    # Seven targets for 60 s each, after a nightly install and build.
    timeout-minutes: 30
    steps:
      - run: dnf -y install --setopt=install_weak_deps=False git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff is taken against main's history.
          fetch-depth: 0
      # Only a change to the parsers or targets is fuzzed (ci/fuzz.sh
      # checks the same), so other PRs skip the setup as well.
      - id: changed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git diff --quiet "$(git merge-base origin/main HEAD)" -- crates/matters-sync crates/matters-sync-client/src fuzz; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: ./.github/actions/setup
        with:
          tools: cargo-fuzz
      - if: steps.changed.outputs.run == 'true'
        run: ci/fuzz.sh
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 14
          if-no-files-found: ignore

  relay:
    name: relay against PostgreSQL
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 30
    # ADR 0003's pin: PostgreSQL 18.x, synchronous commit (its default).
    services:
      postgres:
        image: docker.io/library/postgres:18.7
        env:
          POSTGRES_PASSWORD: relay
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      MATTERS_RELAY_TEST_DATABASE_URL: postgres://postgres:relay@postgres:5432/postgres
    steps:
      - run: dnf -y install --setopt=install_weak_deps=False git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: ci/relay-tests.sh

  image:
    name: self-hosted relay image
    runs-on: ubuntu-24.04
    # A release build in the image, then the stack's start.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff is taken against main's history.
          fetch-depth: 0
      # Only a change to the relay, matters-sync or the packaging builds the
      # image (ci/relay-image.sh checks the diff).
      - run: ci/relay-image.sh
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-image-log
          path: target/relay-image.log
          retention-days: 14
          if-no-files-found: ignore

  # The required check: passes only when every job above passed.
  result:
    name: clippy and tests
    if: always()
    needs: [lint, tests, ui, style, coverage, mutants, flatpak, fuzz, relay, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "A required job did not pass: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - run: echo "All jobs passed."
