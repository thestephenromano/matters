name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Each job runs a gate script from ci/; ci/check.sh runs them all locally.
# Qt 6.8+ and current GTK/libadwaita come from Fedora's packages, the same
# system the app is developed on. git is installed before checkout so the
# checkout keeps .git (the hygiene gate reads the index).
jobs:
  lint:
    name: lint (fmt, clippy, docs, deny, hygiene)
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 30
    steps:
      - run: dnf -y install --setopt=install_weak_deps=False git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cargo-deny: "true"
      - run: ci/hygiene.sh
      - run: ci/lint.sh
      - run: ci/deny.sh

  tests:
    name: workspace tests
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 30
    steps:
      - run: dnf -y install --setopt=install_weak_deps=False git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: ci/workspace-tests.sh

  ui:
    name: Qt UI tests (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [reduced, animations]
    steps:
      - run: dnf -y install --setopt=install_weak_deps=False git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: ci/ui-lane.sh ${{ matrix.lane }} target/ui-reports
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-${{ matrix.lane }}
          path: target/ui-reports/
          retention-days: 14
          if-no-files-found: warn

  style:
    name: control style under COSMIC's theme
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 30
    env:
      MATTERS_REQUIRE_COSMIC_THEME: "1"
    steps:
      - run: dnf -y install --setopt=install_weak_deps=False git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          deps-args: --desktop-themes
      - run: ci/style-check.sh

  # The required check: passes only when every job above passed.
  result:
    name: clippy and tests
    if: always()
    needs: [lint, tests, ui, style]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "A required job did not pass: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - run: echo "All jobs passed."
