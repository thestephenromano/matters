name: Sync prototype

on:
  pull_request: # Run for every PR: the evidence manifest can bind files anywhere.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sync-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/sync-prototype
    defaults:
      run:
        working-directory: experiments/sync-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: experiments/sync-prototype/tests/vectors/record-contract/requirements.txt
      - name: Check execution evidence against the checkout
        run: python tests/vectors/record-contract/check_evidence.py
      - name: Install independent fixture oracle
        run: >-
          python -m pip install --only-binary=:all: -r tests/vectors/record-contract/requirements.txt
      - name: Check independent fixture regeneration
        run: python tests/vectors/record-contract/generate.py --check
      - name: Check independent key-distribution fixtures
        run: python tests/vectors/key-distribution/generate.py --check
      - name: Check oracle guards with optimized Python
        run: python tests/vectors/check_oracles.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/sync-prototype -> ../../target/sync-prototype
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --features crypto-probe,record-contract -- -D warnings
      - run: cargo test --locked --features crypto-probe,record-contract
      - name: Run ignored crash helpers through direct discovery too
        run: cargo test --locked --features crypto-probe,record-contract -- --include-ignored
