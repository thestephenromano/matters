[package]
name = "matters-sync-baseline"
version = "0.0.0"
edition = "2021"
publish = false
license.workspace = true
# Member of the app workspace (not the prototype's): it resolves against the
# app's committed Cargo.lock, so it measures exactly the app's SQLite stack and
# never needs a separate lockfile refresh. CI and measurements use --locked.
workspace = "../../.."

[dependencies]
matters-core = { path = "../../../crates/matters-core" }
serde_json = "1"
uuid = "1"

[dev-dependencies]
rusqlite = { version = "=0.43.0", features = ["bundled"] }
