<?xml version="1.0" encoding="UTF-8"?>
<!-- Matters' application icon: a finished task (a ticked circle) leading
     a short list, on a calm blue tile. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4DABF7"/>
      <stop offset="1" stop-color="#1C7ED6"/>
    </linearGradient>
  </defs>
  <!-- The tile, with a darker lower edge for depth. -->
  <rect x="12" y="16" width="104" height="100" rx="22" fill="#1864AB"/>
  <rect x="12" y="12" width="104" height="100" rx="22" fill="url(#tile)"/>
  <!-- The ticked task. -->
  <circle cx="42" cy="44" r="15" fill="#FFFFFF"/>
  <path d="M34.5 44.5l5.5 5.5 10-11" fill="none" stroke="#1C7ED6" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="64" y="40" width="34" height="8" rx="4" fill="#FFFFFF"/>
  <!-- The tasks still to do. -->
  <circle cx="42" cy="80" r="12.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="4"/>
  <rect x="64" y="76" width="26" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.8"/>
</svg>
