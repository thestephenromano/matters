# Matters as a Flatpak (#73), on KDE's Qt 6.11 runtime.
#
# Built offline. The crates come from cargo-sources.json, which
# ci/flatpak.sh generates from Cargo.lock (it is not kept in the repository,
# so it can't drift from the lock file). The compiler is the official Rust
# toolchain pinned in rust-toolchain.toml, downloaded as checksummed archives,
# so the Flatpak is built with the compiler CI tests; ci/hygiene.sh checks the
# two versions agree.
#
# It builds natively on x86_64 and aarch64; CI builds, installs and starts
# both, and the release workflow (.github/workflows/release.yml) bundles
# both.
#
# Build and install: ci/flatpak.sh (see that script for the steps).
app-id: io.github.thestephenromano.Matters
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: matters-ui
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Reminders (#60) are desktop notifications.
  - --talk-name=org.freedesktop.Notifications
  # Sync to the relay (#39, #42): HTTPS, and its hints WebSocket.
  - --share=network
  # The sync device keys (#37) need nothing more: inside the sandbox oo7
  # keeps them in a file keyring under the app's own data directory,
  # sealed with a key from the Secret portal, which a Flatpak reaches
  # without a permission. oo7 falls back to the host's Secret Service only
  # where the portal is missing; that would take
  # --talk-name=org.freedesktop.secrets, the whole host keyring, so it is
  # not granted.
modules:
  - name: matters
    buildsystem: simple
    build-options:
      append-path: /run/build/matters/rust/bin
      env:
        CARGO_HOME: /run/build/matters/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      # The toolchain, installed into the build directory only: it is not
      # part of the app.
      - sh rust-dist/rustc/install.sh --prefix=/run/build/matters/rust --disable-ldconfig
      - sh rust-dist/cargo/install.sh --prefix=/run/build/matters/rust --disable-ldconfig
      - sh rust-dist/rust-std/install.sh --prefix=/run/build/matters/rust --disable-ldconfig
      - cargo --version
      - cargo build --release --locked --offline -p matters-ui
      - install -Dm755 target/release/matters-ui /app/bin/matters-ui
      - install -Dm644 packaging/linux/${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      # D-Bus activation (#203): a call while Matters is closed starts it
      # with no window. Flatpak points Exec at the sandboxed app on export.
      - install -Dm644 packaging/linux/${FLATPAK_ID}.service /app/share/dbus-1/services/${FLATPAK_ID}.service
      - install -Dm644 packaging/linux/${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 packaging/linux/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 packaging/linux/icons/hicolor/symbolic/apps/${FLATPAK_ID}-symbolic.svg /app/share/icons/hicolor/symbolic/apps/${FLATPAK_ID}-symbolic.svg
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .claude
          - target
          - packaging/flatpak/.flatpak-builder
      # Rust 1.100.0 (rust-toolchain.toml), from static.rust-lang.org: the
      # host toolchain for each architecture the Flatpak is built on. The
      # checksums are the ones static.rust-lang.org publishes beside each
      # archive (<archive>.sha256); ci/hygiene.sh checks every archive's
      # version and that it is fetched only on its own architecture.
      - type: archive
        url: https://static.rust-lang.org/dist/rustc-1.100.0-x86_64-unknown-linux-gnu.tar.xz
        sha256: f1d0b1dec81dab6f523cd098507763487b0d4bd7fd2c87582f154128719be03b
        dest: rust-dist/rustc
        only-arches: [x86_64]
      - type: archive
        url: https://static.rust-lang.org/dist/cargo-1.100.0-x86_64-unknown-linux-gnu.tar.xz
        sha256: 7e29ce07d7c6e92d1826870575ba27d57fff6cb3e754aa57d99099cb88fab35d
        dest: rust-dist/cargo
        only-arches: [x86_64]
      - type: archive
        url: https://static.rust-lang.org/dist/rust-std-1.100.0-x86_64-unknown-linux-gnu.tar.xz
        sha256: 4591b6486594ded52ecd6135db95bf9355bbd3ca7a380888b141528bbcf9a5d4
        dest: rust-dist/rust-std
        only-arches: [x86_64]
      - type: archive
        url: https://static.rust-lang.org/dist/rustc-1.100.0-aarch64-unknown-linux-gnu.tar.xz
        sha256: fcbfa5b8a0cb28f0c4edfb6dda6910ee910993db31f05258613f5cd5b851263a
        dest: rust-dist/rustc
        only-arches: [aarch64]
      - type: archive
        url: https://static.rust-lang.org/dist/cargo-1.100.0-aarch64-unknown-linux-gnu.tar.xz
        sha256: d07ee80eb6ba3c5845c554ac88086e1ff5d63f83d99c3c09cb32504cbedd6844
        dest: rust-dist/cargo
        only-arches: [aarch64]
      - type: archive
        url: https://static.rust-lang.org/dist/rust-std-1.100.0-aarch64-unknown-linux-gnu.tar.xz
        sha256: c73f62fbe5d837f9807ed9e0076575dd8d3475c79af2b30e3570d328e6713f8f
        dest: rust-dist/rust-std
        only-arches: [aarch64]
      # The crates in Cargo.lock, generated by ci/flatpak.sh.
      - cargo-sources.json
