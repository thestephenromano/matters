# A self-hosted relay (#44): PostgreSQL, the relay, and Caddy in front for
# TLS. From the repository root:
#
#   cp packaging/relay/relay.env.example packaging/relay/relay.env   # then edit it
#   docker compose -f packaging/relay/compose.yaml up -d --build
#
# Only Caddy publishes ports. The relay and its metrics listener stay on the
# stack's private network. See docs/SELF_HOSTING.md.
name: matters-relay

services:
  postgres:
    # postgres:18.7, pinned.
    image: docker.io/library/postgres:18.7@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    environment:
      POSTGRES_USER: relay
      POSTGRES_DB: relay
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "relay", "-d", "relay"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  relay:
    build:
      context: ../..
      dockerfile: packaging/relay/Containerfile
    image: matters-relay:local
    env_file: relay.env
    environment:
      MATTERS_RELAY_LISTEN: 0.0.0.0:8484
      MATTERS_RELAY_METRICS_LISTEN: 0.0.0.0:9484
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    # caddy:2.11, pinned.
    image: docker.io/library/caddy:2.11@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    env_file: relay.env
    ports:
      - "${MATTERS_RELAY_HTTPS_PORT:-443}:443"
      - "${MATTERS_RELAY_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped

secrets:
  postgres_password:
    file: postgres_password

volumes:
  postgres:
  caddy:
