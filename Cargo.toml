[workspace]
members = [
    "crates/matters-core",
    "crates/matters-ui",
    "crates/matters-gtk",
    "crates/matters-sync",
    "crates/matters-keyring",
    "crates/matters-relay",
    "crates/matters-sync-client",
    "crates/matters-syncd",
    # Sync-prototype measurement helper: shares the app lockfile so it measures
    # the app's exact SQLite stack.
    "experiments/sync-prototype/baseline",
]
resolver = "2"

[workspace.package]
license = "MIT OR Apache-2.0"
